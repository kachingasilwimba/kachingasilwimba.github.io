- id: emulation
  topic: Land-surface emulation
  area: Evidential deep learning
  title: Uncertainty-aware emulation of CLM5 leaf area index
  summary: I led development of a surrogate for CLM5 leaf area index anomalies to quantify prediction uncertainty and test which model parameters matter by season.
  data_scope: 400 training simulations spanning 32 model parameters.
  method: An evidential neural network predicts leaf area anomalies and estimates data and model uncertainty in one pass.
  result: R² of 0.83 against CLM5 on held-out parameter settings and years.
  paper: https://doi.org/10.1029/2025MS005587
  links:
    - label: View the code
      url: https://github.com/kachingasilwimba/clm5-lai-ppe-ednn
    - label: Reproduce the figures
      url: https://doi.org/10.5281/zenodo.17418678
    - label: Get the data
      url: https://doi.org/10.5281/zenodo.15170936
  figures:
    - id: validation
      label: Figure 2
      title: Does the emulator work on unseen data?
      preview: Held-out validation
      image: /assets/portfolio/land-surface-figure-2.webp
      width: 1511
      height: 706
      alt: Three density plots compare predicted and simulated leaf area index anomalies, with R-squared values of 0.91, 0.83, and 0.83.
      takeaway: The closer the dense points are to the diagonal, the closer the emulator is to CLM5. It tracked leaf area changes even when both the model settings and years were new to it.
      metric:
        value: '0.83'
        label: R² on held-out members and years
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0002
      credit: Silwimba et al. (2026), Figure 2
      rights: Archived author figure
    - id: seasonal
      label: Figure 3
      title: How does accuracy change by season?
      preview: Seasonal accuracy
      image: /assets/portfolio/research/figure-3-seasonal-validation.webp
      width: 1111
      height: 1208
      alt: Four seasonal hexbin plots compare emulator and CLM5 leaf area index anomalies.
      takeaway: Agreement with CLM5 was strongest in winter and summer. Spring was harder to match, but the emulator still outperformed a baseline that predicted no departure from typical conditions.
      metric:
        value: '0.71'
        label: Spring skill relative to the zero-anomaly baseline
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0003
      credit: Silwimba et al. (2026), Figure 3
      rights: Archived author figure
    - id: monthly-uncertainty
      label: Figure 8
      title: When is the emulator most uncertain?
      preview: Monthly uncertainty
      image: /assets/portfolio/research/figure-8-monthly-uncertainty.webp
      width: 1927
      height: 820
      alt: Grouped bars compare monthly data-related, model-related, and total uncertainty in leaf area index anomalies, with error bars for year-to-year variation.
      takeaway: Across 100 held-out ensemble runs, total uncertainty was highest in March and lowest in December.
      metric:
        value: March
        label: Month of highest total uncertainty
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0008
      credit: Silwimba et al. (2026), Figure 8
      rights: CC BY 4.0 · Cropped from the published PDF
    - id: uncertainty-calibration
      label: Figure 9
      title: How reliable are the uncertainty estimates?
      preview: Calibration diagnostics
      image: /assets/portfolio/research/figure-9-uncertainty-calibration.webp
      width: 1925
      height: 777
      alt: A reliability diagram compares observed and expected interval coverage. Histograms of the predicted probability at each observed outcome have tall bars at both ends.
      takeaway: The prediction intervals covered about as many results as expected on average. Spikes at both ends of the histogram show that the model assigned too little spread to extreme outcomes.
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0009
      credit: Silwimba et al. (2026), Figure 9
      rights: CC BY 4.0 · Cropped from the published PDF
    - id: uncertainty-discard-test
      label: Figure 10
      title: Can uncertainty flag larger prediction errors?
      preview: Uncertainty discard test
      image: /assets/portfolio/research/figure-10-uncertainty-discard-test.webp
      width: 2198
      height: 717
      alt: A line chart shows prediction error after dropping the most uncertain points. A bar chart compares the two uncertainty rankings for ten held-out ensemble runs.
      takeaway: Removing the most uncertain predictions generally reduced the error of those that remained. Which uncertainty measure ranked errors better varied by ensemble run.
      metric:
        value: '10'
        label: Held-out ensemble runs compared
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0010
      credit: Silwimba et al. (2026), Figure 10
      rights: CC BY 4.0 · Cropped from the published PDF
    - id: sensitivity
      label: Figure 12
      title: Which model settings matter most?
      preview: Parameter sensitivity
      image: /assets/portfolio/research/figure-12-seasonal-sensitivity.webp
      width: 1800
      height: 1887
      alt: Four bar charts show how individual CLM5 parameters and their interactions contribute to seasonal leaf area index variability.
      takeaway: Photosynthesis parameters matter across seasons. In fall, one setting related to photosynthetic capacity explained nearly one-fifth of the simulated variation in leaf area on its own.
      metric:
        value: '≈18%'
        label: Fall variation attributed to one parameter
      source: https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2025MS005587#jame70458-fig-0012
      credit: Silwimba et al. (2026), Figure 12
      rights: Archived author figure

- id: moisture
  topic: Soil moisture
  area: Land-surface hydrology
  title: EOF analysis of CLM5 soil moisture variability
  summary: I led an empirical orthogonal function (EOF) analysis to test how soil parameter choices affect where and when root-zone moisture varies.
  data_scope: 31 years of soil moisture from seven CLM5 configurations and ERA5-Land.
  method: Truncated singular value decomposition isolates the leading spatial patterns and tracks how they vary over time.
  result: The leading pattern agreed well with ERA5-Land in the western United States. Differences were larger in the central Great Plains.
  paper: https://doi.org/10.5194/gmd-18-7707-2025
  links:
    - label: View the analysis code
      url: https://github.com/kachingasilwimba/spmip-eof-analysis
    - label: Get the data
      url: https://doi.org/10.5281/zenodo.15078448
  figures:
    - id: geography
      label: Figure 9
      title: Where do the moisture patterns change?
      preview: Spatial patterns
      image: /assets/portfolio/soil-moisture.webp
      width: 1020
      height: 724
      alt: Twelve maps show three leading soil-moisture patterns for ERA5-Land and three CLM5 experiments.
      takeaway: The maps show which regions tend to wet or dry together. The broadest pattern recurs across the runs, while secondary patterns reveal where the simulations respond differently to the soil settings.
      source: https://gmd.copernicus.org/articles/18/7707/2025/#Ch1.F9
      credit: Silwimba et al. (2025), Figure 9
      rights: CC BY 4.0
    - id: dominant-patterns
      label: Figure 3
      title: How do we find the strongest patterns?
      preview: Extracting patterns
      image: /assets/portfolio/research/soil-figure-3-reducing-variability.webp
      width: 587
      height: 320
      alt: Diagram of truncated singular value decomposition splitting soil moisture data into spatial patterns, their weights, and how each pattern changes over time.
      takeaway: The analysis keeps the patterns that explain the most soil moisture variability. It shows where conditions tend to change together and how strongly each pattern appears over time.
      source: https://gmd.copernicus.org/articles/18/7707/2025/#Ch1.F3
      credit: Silwimba et al. (2025), Figure 3
      rights: CC BY 4.0
    - id: pattern-agreement
      label: Figure 12
      title: How closely do the simulations agree?
      preview: Comparing patterns
      image: /assets/portfolio/research/soil-figure-12-pattern-agreement.webp
      width: 1892
      height: 624
      alt: Three Taylor diagrams compare the leading soil moisture patterns from seven CLM5 experiments with ERA5-Land, marked with a red star.
      takeaway: The second leading pattern generally matched the ERA5-Land reference less closely than the first or third. Agreement depended on which pattern and soil settings were compared.
      source: https://gmd.copernicus.org/articles/18/7707/2025/#Ch1.F12
      credit: Silwimba et al. (2025), Figure 12
      rights: CC BY 4.0
    - id: regional-differences
      label: Figure 11
      title: Where do the largest differences remain?
      preview: Regional differences
      image: /assets/portfolio/research/soil-figure-11-regional-differences.webp
      width: 1440
      height: 821
      alt: Nine maps compare three CLM5 experiments with ERA5-Land. Hatched regions show closer agreement and darker orange or red regions show larger differences.
      takeaway: The leading soil moisture pattern agreed especially well with ERA5-Land in the western United States. The central Great Plains showed larger differences across experiments and patterns.
      source: https://gmd.copernicus.org/articles/18/7707/2025/#Ch1.F11
      credit: Silwimba et al. (2025), Figure 11
      rights: CC BY 4.0

- id: streamflow
  topic: Streamflow prediction
  area: Mountain hydrology
  title: Evidential emulation of monthly streamflow anomalies
  summary: I developed an emulator to test how training diversity affects streamflow predictions, uncertainty, and transfer across snow-dominated basins.
  data_scope: 69 snow-dominated basins and training sets of 30 to 150 CLM5 ensemble members.
  method: Evidential deep learning estimates uncertainty. Transfer tests fine-tune models on the two clusters with the highest snow fractions.
  result: The largest gains in prediction skill came as training grew from 30 to 60 ensemble members. Larger ensembles narrowed the transfer gap.
  paper: https://essopenarchive.org/doi/full/10.22541/essoar.15003561/v1
  paper_label: Read the preprint
  links:
    - label: View the analysis code
      url: https://doi.org/10.5281/zenodo.18357484
    - label: Get the basin-scale data
      url: https://doi.org/10.5281/zenodo.15720131
  figures:
    - id: training-diversity
      label: Figure 2
      title: How does a larger training ensemble affect accuracy?
      preview: Training diversity
      image: /assets/portfolio/research/streamflow-figure-2.webp
      width: 1601
      height: 1154
      alt: Four line charts show predictive skill, root-mean-square error, bias, and mean absolute error across four basin clusters as training expands from 30 to 150 CLM5 ensemble members.
      takeaway: Training on more CLM5 simulations generally improved skill and reduced error. The biggest gains usually came when training expanded from 30 to 60 ensemble members.
      metric:
        value: '30 to 60'
        label: Ensemble members during the largest gains
      source: https://essopenarchive.org/doi/pdf/10.22541/essoar.15003561/v1?redirectToLatest=false#page=16
      credit: Silwimba et al. (2026), ESS Open Archive, Figure 2
      rights: Author/funder copyright
    - id: point-calibration
      label: Figure 4
      title: How well does the emulator capture extremes?
      preview: Prediction calibration
      image: /assets/portfolio/research/streamflow-figure-4.webp
      width: 1601
      height: 807
      alt: A binned calibration plot and a quantile plot compare predicted streamflow anomalies with CLM5 simulations for four clusters. Both compare the results with a diagonal line of perfect agreement.
      takeaway: Predictions closely tracked the middle of the simulated distribution. At the extremes, the emulator tended to predict higher values for low-flow anomalies and lower values for high-flow anomalies.
      source: https://essopenarchive.org/doi/pdf/10.22541/essoar.15003561/v1?redirectToLatest=false#page=18
      credit: Silwimba et al. (2026), ESS Open Archive, Figure 4
      rights: Author/funder copyright
    - id: transfer-skill
      label: Figure 8
      title: How well does the model transfer to other basins?
      preview: Transfer to new basins
      image: /assets/portfolio/research/streamflow-figure-8.webp
      width: 1601
      height: 1003
      alt: Four charts compare transferred models with models trained on each target cluster. The skill and error differences approach the zero line as the training ensemble grows.
      takeaway: Models transferred from other clusters generally had lower skill than models trained on the target clusters. A more diverse training ensemble narrowed the gap, particularly for target Cluster 6.
      source: https://essopenarchive.org/doi/pdf/10.22541/essoar.15003561/v1?redirectToLatest=false#page=22
      credit: Silwimba et al. (2026), ESS Open Archive, Figure 8
      rights: Author/funder copyright
    - id: uncertainty-components
      label: Figure 3
      title: Which uncertainty shrinks with more training data?
      preview: Sources of uncertainty
      image: /assets/portfolio/research/streamflow-figure-3.webp
      width: 1601
      height: 619
      alt: Two charts compare model uncertainty and data variability across four basin clusters as the number of CLM5 ensemble members used in training increases.
      takeaway: Model uncertainty generally fell as the training ensemble grew. The uncertainty associated with variability in the data stayed comparatively small, with some clusters increasing at the largest training size.
      source: https://essopenarchive.org/doi/pdf/10.22541/essoar.15003561/v1?redirectToLatest=false#page=17
      credit: Silwimba et al. (2026), ESS Open Archive, Figure 3
      rights: Author/funder copyright
